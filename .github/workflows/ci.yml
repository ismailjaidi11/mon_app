name: tests de mon appli

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install -r requirements.txt pytest
      - name: Lancer les tests
        run: pytest -v
  share:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Se connecter au registre
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Construire l'image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/mon_app:latest .
      - name: Publier l'image
        run: docker push ghcr.io/${{ github.repository_owner }}/mon_app:latest
  